name: Release Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v0.4.0-beta) to attach installers to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install desktop frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri installer bundle
        working-directory: apps/desktop
        run: npx tauri build --target ${{ matrix.target }}

      - name: Upload installer artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          FILES=()
          while IFS= read -r -d '' file; do
            FILES+=("$file")
          done < <(find "$BUNDLE_DIR" -maxdepth 3 -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" \) -print0 2>/dev/null)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No installer artifacts found under $BUNDLE_DIR"
            exit 1
          fi
          echo "Uploading ${#FILES[@]} artifact(s) to release $RELEASE_TAG:"
          printf '  - %s\n' "${FILES[@]}"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            PRERELEASE_FLAG=""
            if [[ "$RELEASE_TAG" == *-* ]]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$RELEASE_TAG" --title "DreamForge $RELEASE_TAG" $PRERELEASE_FLAG --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber
